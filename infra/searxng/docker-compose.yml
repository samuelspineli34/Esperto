services:
  searxng:
    image: searxng/searxng:latest
    container_name: esperto-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET}"
      SEARXNG_LIMITER: "false"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
