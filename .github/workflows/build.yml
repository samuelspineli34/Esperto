name: Gerar Executável Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Dependências do Projeto
        run: npm install

      - name: Compilar o Executável (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Esperto v__VERSION__'
          releaseBody: 'Executável gerado com sucesso!'
          releaseDraft: false
          prerelease: false

      - name: Disponibilizar o arquivo .exe para Download
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Esperto-Instalador-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi