name: Compilar Esperto Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Cria a tag de versão e a Release
  create-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar Tag de Versao
        id: tag_version
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Esperto ${{ steps.tag_version.outputs.new_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Compila Windows e Linux
  build-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.name }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Dependencias (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Dependencias do Projeto
        run: npm install

      - name: Sincronizar Versao Dinamica
        shell: bash
        run: |
          TAG="${{ needs.create-release.outputs.new_version }}"
          CLEAN_VERSION="${TAG#v}"
          echo "Injetando versao: $CLEAN_VERSION"

          npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version

          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$CLEAN_VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          "
        env:
          APP_VERSION: ${{ needs.create-release.outputs.new_version }}

      - name: Compilar App Desktop (Tauri)
        run: npx tauri build
        env:
          APP_VERSION: ${{ needs.create-release.outputs.new_version }}

      - name: Anexar Instaladores na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.new_version }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}