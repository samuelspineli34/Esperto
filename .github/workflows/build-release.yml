name: Compilar Esperto Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # 1. Cria a tag de versão e a Release no GitHub
  create-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar Tag de Versão
        id: tag_version
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Esperto ${{ steps.tag_version.outputs.new_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Compila para Windows, Linux e macOS (em paralelo)
  build-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact_name: windows-assets
          - os: ubuntu-latest
            name: Linux
            artifact_name: linux-assets
          - os: macos-latest
            name: macOS
            artifact_name: macos-assets

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.name }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      # Dependências exclusivas do Linux
      - name: Instalar Dependências (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Dependências do Projeto
        run: npm install

      - name: Sincronizar Versão Dinâmica
        shell: bash
        run: |
          TAG="${{ needs.create-release.outputs.new_version }}"
          CLEAN_VERSION="${TAG#v}"
          echo "Injetando versão: $CLEAN_VERSION"

          npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version

          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$CLEAN_VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          "
        env:
          APP_VERSION: ${{ needs.create-release.outputs.new_version }}

      - name: Compilar App Desktop (Tauri)
        run: npx tauri build
        env:
          APP_VERSION: ${{ needs.create-release.outputs.new_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # --- ETAPA EXCLUSIVA PARA O WINDOWS: ASSINATURA COM SIGNPATH ---
      - name: Verificar Secrets do SignPath (Windows)
        if: matrix.os == 'windows-latest'
        id: check-secrets
        run: |
          if [[ -z "${{ secrets.SIGNPATH_API_TOKEN }}" ]] || [[ -z "${{ secrets.SIGNPATH_ORGANIZATION_ID }}" ]]; then
            echo "::warning::SignPath secrets não configurados. Assinatura será pulada."
            echo "signing-available=false" >> $GITHUB_OUTPUT
          else
            echo "signing-available=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Assinar executável com SignPath
        if: matrix.os == 'windows-latest' && steps.check-secrets.outputs.signing-available == 'true'
        id: sign-exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1

          $url = "https://app.signpath.io/Api/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/SigningRequests/SubmitWithArtifact"

          $result = curl.exe -sS -X POST `
            -H "Authorization: Bearer $env:SIGNPATH_API_TOKEN" `
            -F "projectSlug=Esperto" `
            -F "signingPolicySlug=Esperto" `
            -F "artifactConfigurationSlug=initial" `
            -F "artifact=@$($exe.FullName)" `
            -F "description=Esperto $env:APP_VERSION" `
            "$url" | ConvertFrom-Json

          $requestId = $result.signingRequestId
          Write-Host "Signing Request: $requestId"

          do {
            Start-Sleep -Seconds 10

            $status = curl.exe -sS `
              -H "Authorization: Bearer $env:SIGNPATH_API_TOKEN" `
              "https://app.signpath.io/Api/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/SigningRequests/$requestId/Status" |
              ConvertFrom-Json

            Write-Host "Status: $($status.status) / $($status.workflowStatus)"
          } while (-not $status.isFinalStatus)

          if ($status.status -ne "Completed") {
            throw "SignPath falhou: $($status.status) / $($status.workflowStatus)"
          }

          New-Item -ItemType Directory -Force -Path "windows-signed-exe" | Out-Null

          curl.exe -sS `
            -H "Authorization: Bearer $env:SIGNPATH_API_TOKEN" `
            -o "windows-signed-exe/$($exe.Name)" `
            "https://app.signpath.io/Api/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/SigningRequests/$requestId/SignedArtifact"

          Write-Host "Executável assinado com sucesso."
          Copy-Item windows-signed-exe/*.exe src-tauri/target/release/bundle/nsis/ -Force
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          APP_VERSION: ${{ needs.create-release.outputs.new_version }}

      # Gera o manifesto latest.json (Windows)
      - name: Gerar manifesto latest.json (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.TAG;
            const cleanVersion = (tag || '').replace(/^v/, '');
            const nsisDir = './src-tauri/target/release/bundle/nsis';
            
            if (fs.existsSync(nsisDir)) {
              const files = fs.readdirSync(nsisDir);
              const sigFile = files.find(f => f.endsWith('.nsis.zip.sig') || f.endsWith('.zip.sig'));
              if (sigFile) {
                const sigContent = fs.readFileSync(path.join(nsisDir, sigFile), 'utf8').trim();
                const zipName = sigFile.replace('.sig', '');
                const manifest = {
                  version: cleanVersion,
                  notes: 'Atualizacao automatica do Esperto para a versao ' + tag,
                  pub_date: new Date().toISOString(),
                  platforms: {
                    'windows-x86_64': {
                      signature: sigContent,
                      url: 'https://github.com/samuelspineli34/Esperto/releases/download/' + tag + '/' + zipName
                    }
                  }
                };
                fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
                console.log('latest.json gerado com sucesso!');
              }
            }
          "
        env:
          TAG: ${{ needs.create-release.outputs.new_version }}

      # Salva os arquivos de cada sistema como artefatos
      - name: Salvar Artefatos Compilados (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            latest*.json
          if-no-files-found: ignore

      - name: Salvar Artefatos Compilados (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: ignore

      - name: Salvar Artefatos Compilados (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
          if-no-files-found: ignore

  # 3. Publica todos os arquivos na Release de forma limpa, segura e sem concorrência
  publish-release:
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório para contexto git
        uses: actions/checkout@v4

      - name: Baixar todos os artefatos compilados
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Inspecionar arquivos prontos para publicação
        run: |
          echo "=== Arquivos encontrados para envio à Release ==="
          ls -lh release-assets

      - name: Enviar Arquivos para a Release no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.new_version }}
        run: |
          gh release upload "$TAG" release-assets/* --clobber --repo "${{ github.repository }}"