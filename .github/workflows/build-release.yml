name: Compilar Esperto Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

# Cancela automaticamente execucoes anteriores se houver novo commit
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Cria a tag de versao e a Release no GitHub
  create-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar Tag de Versao
        id: tag_version
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Esperto ${{ steps.tag_version.outputs.new_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Compila para Windows, Linux e macOS
  build-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.name }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      # Dependencias exclusivas do Linux
      - name: Instalar Dependencias (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Dependencias do Projeto
        run: npm install

      - name: Sincronizar Versao Dinamica
        shell: bash
        run: |
          TAG="${{ needs.create-release.outputs.new_version }}"
          CLEAN_VERSION="${TAG#v}"
          echo "Injetando versao: $CLEAN_VERSION"

          npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version

          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$CLEAN_VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          "
        env:
          APP_VERSION: ${{ needs.create-release.outputs.new_version }}

      - name: Compilar App Desktop (Tauri)
        run: npx tauri build
        env:
          APP_VERSION: ${{ needs.create-release.outputs.new_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # --- ETAPA EXCLUSIVA PARA O WINDOWS: ASSINATURA DIGITADA COM SIGNPATH ---
      - name: Enviar executavel unsigned para o GitHub (Windows)
        if: matrix.os == 'windows-latest'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Verificar Secrets do SignPath
        if: matrix.os == 'windows-latest'
        id: check-secrets
        run: |
          if [[ -z "${{ secrets.SIGNPATH_API_TOKEN }}" ]] || [[ -z "${{ secrets.SIGNPATH_ORGANIZATION_ID }}" ]]; then
            echo "::warning::SignPath secrets não configurados. Assinatura será pulada."
            echo "signing-available=false" >> $GITHUB_OUTPUT
          else
            echo "signing-available=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Assinar executavel com SignPath
        if: matrix.os == 'windows-latest' && steps.check-secrets.outputs.signing-available == 'true'
        id: sign-exe
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'Esperto'
          signing-policy-slug: 'Esperto'
          artifact-configuration-slug: 'initial'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'windows-signed-exe'

      - name: Relatório de Assinatura
        if: matrix.os == 'windows-latest'
        run: |
          if [[ "${{ steps.check-secrets.outputs.signing-available }}" == "true" ]]; then
            if [[ "${{ steps.sign-exe.outcome }}" == "success" ]]; then
              echo "✅ Executável assinado com sucesso!"
              cp windows-signed-exe/*.exe src-tauri/target/release/bundle/nsis/
            else
              echo "⚠️  Falha ao assinar executável com SignPath:"
              echo "Outcome: ${{ steps.sign-exe.outcome }}"
              echo "O executável unsigned será incluído na release."
              echo ""
              echo "Motivos possíveis:"
              echo "1. Token SignPath expirado ou inválido"
              echo "2. Organização ou projeto SignPath não encontrado"
              echo "3. Problemas de conectividade com a API SignPath"
              echo ""
              echo "Ação: Verifique as credenciais do SignPath em Settings > Secrets"
            fi
          else
            echo "⚠️  SignPath não configurado - usando executável unsigned"
          fi
        shell: bash
      # -----------------------------------------------------------------------

      # Gera o manifesto latest.json em Node.js de forma 100% segura
      - name: Gerar manifesto latest.json (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.TAG;
            const cleanVersion = (tag || '').replace(/^v/, '');
            const nsisDir = './src-tauri/target/release/bundle/nsis';
            
            if (fs.existsSync(nsisDir)) {
              const files = fs.readdirSync(nsisDir);
              const sigFile = files.find(f => f.endsWith('.nsis.zip.sig') || f.endsWith('.zip.sig'));
              if (sigFile) {
                const sigContent = fs.readFileSync(path.join(nsisDir, sigFile), 'utf8').trim();
                const zipName = sigFile.replace('.sig', '');
                const manifest = {
                  version: cleanVersion,
                  notes: 'Atualizacao automatica do Esperto para a versao ' + tag,
                  pub_date: new Date().toISOString(),
                  platforms: {
                    'windows-x86_64': {
                      signature: sigContent,
                      url: 'https://github.com/samuelspineli34/Esperto/releases/download/' + tag + '/' + zipName
                    }
                  }
                };
                fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
                console.log('latest.json gerado com sucesso!');
              }
            }
          "
        env:
          TAG: ${{ needs.create-release.outputs.new_version }}

      # Anexa os instaladores e o manifesto na Release
      - name: Anexar Instaladores e Updater na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.new_version }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.msi
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
            latest*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}