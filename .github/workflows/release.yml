name: Release Multiplataforma Automatica

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Cria a tag de versão e a Release no GitHub
  create-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gera automaticamente tags como v0.1.0 -> v0.1.1 -> v0.1.2
      - name: Gerar Tag de Versão
        id: tag_version
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      # Cria a publicação de Release no GitHub
      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Esperto ${{ steps.tag_version.outputs.new_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Compila simultaneamente para Windows, Linux e Mac com a versão injetada
  build-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      # Dependências do sistema Linux para o Tauri
      - name: Instalar Dependências (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Dependências do Projeto
        run: npm install

      # INJETA A VERSÃO DINÂMICA NO PACKAGE.JSON E TAURI.CONF.JSON
      - name: Sincronizar Versão Dinâmica
        shell: bash
        run: |
          TAG="${{ needs.create-release.outputs.new_version }}"
          CLEAN_VERSION="${TAG#v}"
          echo "Injetando versao: $CLEAN_VERSION (Tag: $TAG)"

          # Atualiza package.json
          npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version

          # Atualiza tauri.conf.json
          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$CLEAN_VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          "
        env:
          APP_VERSION: ${{ needs.create-release.outputs.new_version }}

      - name: Compilar App Desktop (Tauri)
        run: npx tauri build
        env:
          APP_VERSION: ${{ needs.create-release.outputs.new_version }}

      # Anexa os instaladores gerados diretamente na Release criada
      - name: Anexar Instaladores na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.new_version }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}