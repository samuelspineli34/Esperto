<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="70%" stop-color="#0b0714"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="none" stroke="#7e22ce" stroke-width="16" opacity="0.4"/>
  
  <!-- Formato do Olho -->
  <g filter="url(#glow)">
    <path d="M 160 512 Q 512 200 864 512 Q 512 824 160 512 Z" fill="none" stroke="url(#eyeGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="512" cy="512" r="140" fill="#0b0714" stroke="url(#eyeGrad)" stroke-width="40"/>
    <circle cx="512" cy="512" r="70" fill="#c084fc"/>
    <circle cx="540" cy="484" r="22" fill="#ffffff"/>
  </g>
</svg>